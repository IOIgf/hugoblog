# ============================================================
# 基础站点配置
# ============================================================

baseURL = "https://orangeoi.qzz.io/"
title = "Milk_Dragon's blog"
theme = "stack"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
hasCJKLanguage = true

# ============================================================
# 永久链接格式
# ============================================================

[permalinks]
    posts = ":year/:month/:day/:slug/"

# ============================================================
# 输出格式（搜索需要 JSON）
# ============================================================

[outputs]
    home = ["HTML", "RSS", "JSON"]
    page = ["HTML", "JSON"]   # 👈 关键！搜索依赖 JSON

# ============================================================
# 分类/标签
# ============================================================

[taxonomies]
    category = "categories"
    tag = "tags"

# ============================================================
# 代码高亮 + LaTeX
# ============================================================

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
        [markup.goldmark.extensions.passthrough]
            enable = true
            [markup.goldmark.extensions.passthrough.delimiters]
                block = [['\[', '\]'], ['$$', '$$']]
                inline = [['\(', '\)']]
    [markup.highlight]
        style = "dracula"
        lineNumbers = true
